name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Verify correct protocol
        run: npm run peterson
      - name: Compare full and symmetry-reduced exploration
        run: npm run benchmark
      - name: Verify fault injection is detected
        shell: bash
        run: |
          set +e
          npm run broken
          code=$?
          set -e
          test "$code" -eq 1
